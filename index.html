<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan IT | 신선도 스캔</title>
<style>
:root{color-scheme:light;--ink:#292d29;--muted:#737a73;--line:#e5e4de;--paper:#fff;--ground:#f3f2ee;--green:#496c54;--pale:#edf2ed;--amber:#a06b22}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--ground);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(560px,100%);background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 28px #302c2110}header{height:54px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:16px;letter-spacing:.2px}.status{font-size:12px;color:var(--muted);padding:5px 9px;background:#f4f4f1;border-radius:4px}.status.busy{color:var(--green);background:var(--pale)}main{padding:16px 18px}.intro{display:flex;justify-content:space-between;align-items:end;margin:0 0 12px}.intro h1{font-size:16px;margin:0;font-weight:700}.intro p{font-size:11px;color:var(--muted);margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:0;text-align:left;border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit;overflow:hidden;cursor:pointer;font:inherit}.choice:hover,.choice:focus-visible{border-color:#91a492;outline:2px solid #91a492}.choice img{width:100%;height:190px;object-fit:cover;display:block;background:#eee}.choice:first-child img{object-position:center 52%}.choice:last-child img{object-position:center 52%}.caption{display:block;padding:10px 11px}.caption strong{font-size:13px}.caption small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.photo-box{position:relative;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#f1f1ed}.photo-box img{display:block;width:100%;height:min(48vw,260px);min-height:190px;object-fit:cover}.photo-box.meat img{object-position:center 50%}.photo-box.fruit img{object-position:center 50%}.photo-box.transmitted img{filter:grayscale(.9) sepia(.28) hue-rotate(65deg) saturate(.75) contrast(1.12) brightness(.83)}.photo-box.scanning:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#90a993;animation:scan 1.3s ease-in-out forwards}@keyframes scan{to{transform:translateY(250px)}}.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-size:10px;color:var(--muted);background:#f7f7f4}.tabs{display:flex;gap:6px;margin-top:9px}.tab,.zoom,.back{border:1px solid #dedfd8;border-radius:5px;background:#fff;color:#414841;font:inherit;font-size:11px;padding:7px 10px;cursor:pointer}.tab.active{background:#edf2ed;border-color:#b9c9bb;color:#35523b}.zoom{margin-left:auto}.grade{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:5px;display:flex;align-items:center;gap:10px}.grade .letter{font-size:21px;font-weight:800;color:var(--green);min-width:28px}.grade strong{font-size:12px}.grade small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.scan-msg{font-size:11px;color:var(--muted);margin-top:7px}.result-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.hint{color:var(--muted);font-size:10px}footer{height:35px;border-top:1px solid var(--line);padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#161a17c9;z-index:5}.modal.open{display:grid}.modal-card{width:min(900px,96vw);background:#fff;border-radius:8px;overflow:hidden}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;font-size:12px;border-bottom:1px solid var(--line)}.modal-img{display:block;max-width:100%;max-height:78vh;object-fit:contain;margin:auto}.modal-img.transmitted{filter:grayscale(.9) sepia(.28) hue-rotate(65deg) saturate(.75) contrast(1.12) brightness(.83)}.close{border:0;background:transparent;font-size:20px;cursor:pointer;color:#555}@media(max-width:440px){body{padding:8px}.app{border-radius:8px}header{padding:0 14px}main{padding:14px}.choice img{height:35vw;min-height:120px}.intro p{display:none}footer{padding:0 14px}.photo-box img{height:50vw;min-height:165px}}@media(prefers-reduced-motion:reduce){.photo-box.scanning:after{animation:none;top:50%}}
</style></head><body><div class="app"><header><div class="brand">Scan IT</div><span class="status" id="status">대기 중</span></header><main id="main"><div class="intro"><h1>스캔할 상품을 선택해 주세요</h1><p>실제 포장 사진으로 진행하는 시연</p></div><div class="choices"><button class="choice" data-kind="meat"><img src="images/meat-tray.png" alt="포장된 모둠 고기"><span class="caption"><strong>고기 &amp; 수산</strong><small>포장육 · 수산물</small></span></button><button class="choice" data-kind="fruit"><img src="images/fruit-gift-box.png" alt="과일 선물 세트"><span class="caption"><strong>과일</strong><small>과일 선물 세트</small></span></button></div></main><footer><span id="foot">상품을 선택하면 스캔을 시작합니다</span><span>시연 화면</span></footer></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="사진 확대"><div class="modal-card"><div class="modal-head"><span id="modalTitle">사진 확대</span><button class="close" id="close" aria-label="닫기">×</button></div><img class="modal-img" id="modalImg" alt="확대된 상품 사진"></div></div>
<script>
const main=document.getElementById('main'),status=document.getElementById('status'),foot=document.getElementById('foot'),modal=document.getElementById('modal'),modalImg=document.getElementById('modalImg'),modalTitle=document.getElementById('modalTitle');const initial=main.innerHTML;let timer,activeKind='meat',view='normal';
function home(){clearTimeout(timer);status.className='status';status.textContent='대기 중';foot.textContent='상품을 선택하면 스캔을 시작합니다';main.innerHTML=initial;main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>scan(b.dataset.kind))}
function scan(kind){clearTimeout(timer);activeKind=kind;view='normal';const isMeat=kind==='meat',label=isMeat?'고기 & 수산':'과일',src=document.querySelector('.choice[data-kind="'+kind+'"] img').src;status.className='status busy';status.textContent='스캔 중';foot.textContent='상품을 스캔하고 있습니다';main.innerHTML=`<div class="intro"><h1>${label}</h1><p>사진을 스캔하고 등급을 판정합니다</p></div><div class="photo-box ${kind} scanning" id="photoBox"><img id="productPhoto" src="${src}" alt="${isMeat?'포장된 모둠 고기':'과일 선물 세트'}"><div class="photo-caption"><span id="viewCaption">상품 사진</span><span>사진 확대 가능</span></div></div><div class="tabs"><button class="tab active" data-view="normal">상품 사진</button><button class="tab" data-view="transmitted">투과 사진</button><button class="zoom" id="zoom">사진 확대</button></div><div class="grade" id="grade" style="visibility:hidden"><span class="letter">${isMeat?'A':'B'}</span><span><strong>${isMeat?'A 등급':'B 등급'} · 시연 판정</strong><small>${isMeat?'포장 상태와 육색을 확인한 예시 결과':'과일 구성과 포장 상태를 확인한 예시 결과'}</small></span></div><div class="scan-msg" id="scanMsg">상품을 살펴보고 있습니다…</div><div class="result-actions"><span class="hint">투과 사진은 실제 투과 카메라 측정값이 아닌 시연용 이미지입니다</span><button class="back" id="back">다른 상품 선택</button></div>`;const image=document.getElementById('productPhoto');main.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('zoom').onclick=()=>openZoom(image.src,view,isMeat?'고기 & 수산':'과일');document.getElementById('back').onclick=home;timer=setTimeout(()=>{document.getElementById('photoBox').classList.remove('scanning');status.className='status';status.textContent='판정 완료';foot.textContent='시연용 등급 결과';document.getElementById('grade').style.visibility='visible';document.getElementById('scanMsg').textContent='사진을 눌러 크게 확인하거나 투과 사진 보기로 전환하세요.'},1400)}
function setView(next){view=next;const box=document.getElementById('photoBox'),img=document.getElementById('productPhoto');if(!box||!img)return;box.classList.toggle('transmitted',next==='transmitted');document.getElementById('viewCaption').textContent=next==='transmitted'?'투과 사진 예시 · 시연 이미지':'상품 사진';main.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===next))}
function openZoom(src,mode,label){modalImg.src=src;modalImg.classList.toggle('transmitted',mode==='transmitted');modalTitle.textContent=label+(mode==='transmitted'?' · 투과 사진 확대':' · 상품 사진 확대');modal.classList.add('open')}
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});home();
</script></body></html>
