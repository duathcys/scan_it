<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan IT | 신선도 스캔</title>
<style>
:root{color-scheme:light;--ink:#292d29;--muted:#737a73;--line:#e5e4de;--paper:#fff;--ground:#f3f2ee;--green:#496c54;--pale:#edf2ed;--amber:#a06b22}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--ground);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(620px,100%);background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 28px #302c2110}header{height:54px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:16px;letter-spacing:.2px}.status{font-size:12px;color:var(--muted);padding:5px 9px;background:#f4f4f1;border-radius:4px}.status.busy{color:var(--green);background:var(--pale)}main{padding:16px 18px}.intro{display:flex;justify-content:space-between;align-items:end;margin:0 0 12px}.intro h1{font-size:16px;margin:0;font-weight:700}.intro p{font-size:11px;color:var(--muted);margin:0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{padding:0;text-align:left;border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit;overflow:hidden;cursor:pointer;font:inherit}.choice:hover,.choice:focus-visible{border-color:#91a492;outline:2px solid #91a492}.choice img{width:100%;height:145px;object-fit:cover;display:block;background:#eee}.choice:nth-child(1) img{object-position:center 52%}.choice:nth-child(2) img{object-position:center 50%}.choice:nth-child(3) img{object-position:center 50%}.caption{display:block;padding:9px 11px}.caption strong{font-size:13px}.caption small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.checks{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.checks span{font-size:9px;color:#5e665f;background:#f4f5f1;border-radius:3px;padding:3px 5px}.photo-box{position:relative;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#f1f1ed}.photo-box img{display:block;width:100%;height:min(43vw,250px);min-height:180px;object-fit:cover}.photo-box.meat img{object-position:center 50%}.photo-box.fruit img{object-position:center 50%}.photo-box.seafood img{object-position:center 55%}.photo-box.transmitted img{filter:grayscale(.9) sepia(.28) hue-rotate(65deg) saturate(.75) contrast(1.12) brightness(.83)}.photo-box.scanning:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#90a993;animation:scan 1.3s ease-in-out forwards}@keyframes scan{to{transform:translateY(250px)}}.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-size:10px;color:var(--muted);background:#f7f7f4}.tabs{display:flex;gap:6px;margin-top:9px}.tab,.zoom,.back{border:1px solid #dedfd8;border-radius:5px;background:#fff;color:#414841;font:inherit;font-size:11px;padding:7px 10px;cursor:pointer}.tab.active{background:#edf2ed;border-color:#b9c9bb;color:#35523b}.zoom{margin-left:auto}.grade{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:5px;display:flex;align-items:center;gap:10px}.grade .letter{font-size:21px;font-weight:800;color:var(--green);min-width:28px}.grade strong{font-size:12px}.grade small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.criteria{margin-top:10px;padding:10px 12px;background:#fafaf8;border:1px solid var(--line);border-radius:5px}.criteria h2{font-size:11px;margin:0 0 7px}.criteria ul{margin:0;padding-left:16px;display:flex;flex-wrap:wrap;column-gap:22px;row-gap:4px}.criteria li{font-size:10px;color:#596159}.scan-msg{font-size:11px;color:var(--muted);margin-top:7px}.result-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.hint{color:var(--muted);font-size:10px}footer{height:35px;border-top:1px solid var(--line);padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#161a17c9;z-index:5}.modal.open{display:grid}.modal-card{width:min(900px,96vw);background:#fff;border-radius:8px;overflow:hidden}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;font-size:12px;border-bottom:1px solid var(--line)}.modal-img{display:block;max-width:100%;max-height:78vh;object-fit:contain;margin:auto}.modal-img.transmitted{filter:grayscale(.9) sepia(.28) hue-rotate(65deg) saturate(.75) contrast(1.12) brightness(.83)}.close{border:0;background:transparent;font-size:20px;cursor:pointer;color:#555}.credit{font-size:9px;color:#888;text-align:right;margin:8px 1px 0}.credit a{color:inherit}@media(max-width:440px){body{padding:8px}.app{border-radius:8px}header{padding:0 14px}main{padding:14px}.choice img{height:30vw;min-height:105px}.intro p{display:none}footer{padding:0 14px}.photo-box img{height:49vw;min-height:165px}.criteria ul{column-gap:12px}}@media(prefers-reduced-motion:reduce){.photo-box.scanning:after{animation:none;top:50%}}
</style></head><body><div class="app"><header><div class="brand">Scan IT</div><span class="status" id="status">대기 중</span></header><main id="main"></main><footer><span id="foot">상품을 선택하면 스캔을 시작합니다</span><span>시연 화면</span></footer></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="사진 확대"><div class="modal-card"><div class="modal-head"><span id="modalTitle">사진 확대</span><button class="close" id="close" aria-label="닫기">×</button></div><img class="modal-img" id="modalImg" alt="확대된 상품 사진"></div></div>
<script>
const products={
 fruit:{name:'과일',alt:'과일 선물 세트',src:'images/fruit-gift-box.png',grade:'B',summary:'멍·변색·숙성도 점검 예시',checks:['멍','상처','변색','부패 위험','숙성도']},
 meat:{name:'육류',alt:'포장된 모둠 고기',src:'images/meat-tray.png',grade:'A',summary:'지방 분포와 부위별 편차 점검 예시',checks:['지방 분포','색상','부위별 품질 편차']},
 seafood:{name:'수산물',alt:'포장된 생선 필렛',src:'https://images.unsplash.com/photo-1734819302266-13bacd21ca86?auto=format&fit=crop&w=1000&q=85',grade:'B',summary:'선도와 조직 상태 점검 예시',checks:['선도','색상 변화','조직 손상','부패 징후']}
};
const main=document.getElementById('main'),status=document.getElementById('status'),foot=document.getElementById('foot'),modal=document.getElementById('modal'),modalImg=document.getElementById('modalImg'),modalTitle=document.getElementById('modalTitle');let timer,view='normal';
function home(){clearTimeout(timer);status.className='status';status.textContent='대기 중';foot.textContent='상품을 선택하면 스캔을 시작합니다';main.innerHTML=`<div class="intro"><h1>스캔할 상품을 선택해 주세요</h1><p>실제 상품 사진과 검사 항목</p></div><div class="choices">${Object.entries(products).map(([key,p])=>`<button class="choice" data-kind="${key}"><img src="${p.src}" alt="${p.alt}"><span class="caption"><strong>${p.name}</strong><span class="checks">${p.checks.map(c=>`<span>${c}</span>`).join('')}</span></span></button>`).join('')}</div><div class="credit">수산물 사진: <a href="https://unsplash.com/photos/a-display-case-filled-with-lots-of-different-types-of-fish-xkRf6rTYgds" target="_blank" rel="noreferrer">Jivan Garcha / Unsplash</a></div>`;main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>scan(b.dataset.kind))}
function scan(kind){clearTimeout(timer);view='normal';const p=products[kind];status.className='status busy';status.textContent='스캔 중';foot.textContent=p.name+' 검사 항목을 확인하고 있습니다';main.innerHTML=`<div class="intro"><h1>${p.name} 스캔 결과</h1><p>검사 후 등급을 판정합니다</p></div><div class="photo-box ${kind} scanning" id="photoBox"><img id="productPhoto" src="${p.src}" alt="${p.alt}"><div class="photo-caption"><span id="viewCaption">상품 사진</span><span>확대해서 보기</span></div></div><div class="tabs"><button class="tab active" data-view="normal">상품 사진</button><button class="tab" data-view="transmitted">투과 사진</button><button class="zoom" id="zoom">사진 확대</button></div><div class="criteria"><h2>검사 항목</h2><ul>${p.checks.map(c=>`<li>${c}</li>`).join('')}</ul></div><div class="grade" id="grade" style="visibility:hidden"><span class="letter">${p.grade}</span><span><strong>${p.grade} 등급 · 시연 판정</strong><small>${p.summary}</small></span></div><div class="scan-msg" id="scanMsg">상품 사진을 스캔하고 있습니다…</div><div class="result-actions"><span class="hint">투과 보기는 시연용 이미지 효과입니다</span><button class="back" id="back">다른 상품</button></div>`;const image=document.getElementById('productPhoto');main.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('zoom').onclick=()=>openZoom(image.src,view,p.name);document.getElementById('back').onclick=home;timer=setTimeout(()=>{document.getElementById('photoBox').classList.remove('scanning');status.className='status';status.textContent='판정 완료';foot.textContent='검사 항목과 예시 등급을 확인하세요';document.getElementById('grade').style.visibility='visible';document.getElementById('scanMsg').textContent='상품 사진 또는 투과 보기를 확대해서 확인할 수 있습니다.'},1400)}
function setView(next){view=next;const box=document.getElementById('photoBox');if(!box)return;box.classList.toggle('transmitted',next==='transmitted');document.getElementById('viewCaption').textContent=next==='transmitted'?'투과 사진 예시 · 시연 이미지':'상품 사진';main.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===next))}
function openZoom(src,mode,label){modalImg.src=src;modalImg.classList.toggle('transmitted',mode==='transmitted');modalTitle.textContent=label+(mode==='transmitted'?' · 투과 사진 확대':' · 상품 사진 확대');modal.classList.add('open')}
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});home();
</script></body></html>
